services:
  db:
    image: postgres:16-alpine
    container_name: jornai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jornai
      POSTGRES_PASSWORD: jornai
      POSTGRES_DB: jornai
    ports:
      - "5432:5432"
    volumes:
      - jornai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jornai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  jornai_pgdata:
